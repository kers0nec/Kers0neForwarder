<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAT Discord Forwarder</title>
  <style>
    * { box-sizing: border-box; font-family: 'Courier New', monospace; }
    body { background: #1e1e2e; color: #cdd6f4; padding: 2rem; max-width: 800px; margin: auto; }
    .card { background: #313244; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; box-shadow: 0 0 20px #00000055; }
    label { display: block; margin: 0.8rem 0 0.3rem; font-weight: bold; color: #a6e3a1; }
    input, textarea { width: 100%; padding: 0.7rem; background: #1e1e2e; border: 2px solid #45475a; border-radius: 8px; color: #cdd6f4; font-size: 1rem; }
    button { background: #89b4fa; color: #1e1e2e; border: none; padding: 0.8rem 2rem; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #b4befe; }
    #log { background: #11111b; padding: 1rem; border-radius: 8px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; font-size: 0.9rem; border: 1px solid #45475a; }
    .status { display: inline-block; padding: 0.2rem 1rem; border-radius: 20px; font-weight: bold; }
    .online { background: #a6e3a1; color: #1e1e2e; }
    .offline { background: #f38ba8; color: #1e1e2e; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h1>🐱 CAT · Discord → Webhook</h1>

  <div class="card">
    <label>📡 Channel ID</label>
    <input type="text" id="channelId" placeholder="123456789012345678">

    <label>🔗 Webhook URL</label>
    <input type="url" id="webhook" placeholder="https://discord.com/api/webhooks/...">

    <button id="authBtn">🔑 Login with Discord</button>
    <button id="startBtn" class="hidden">▶ START FORWARDING</button>
    <button id="stopBtn" class="hidden" style="background:#f38ba8; margin-left: 0.5rem;">⏹ STOP</button>
    <span id="statusBadge" class="status offline">OFFLINE</span>
    <span id="userInfo" style="margin-left: 1rem; color: #a6e3a1;"></span>
  </div>

  <div class="card">
    <label>📜 Live Log</label>
    <div id="log">⏳ Ready — login with Discord first</div>
  </div>

  <script>
    // ===== CAT'S PURE BROWSER FORWARDER (NO BOT TOKEN) =====
    const logEl = document.getElementById('log');
    const statusBadge = document.getElementById('statusBadge');
    const userInfo = document.getElementById('userInfo');
    const authBtn = document.getElementById('authBtn');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let token = localStorage.getItem('discord_token') || '';
    let ws = null;
    let heartbeat = null;
    let sessionId = null;
    let lastSeq = null;
    let forwardActive = false;

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `\n[${time}] ${msg}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(online) {
      statusBadge.textContent = online ? '● ONLINE' : '● OFFLINE';
      statusBadge.className = 'status ' + (online ? 'online' : 'offline');
    }

    // ===== DISCORD OAUTH LOGIN (gets user token) =====
    async function loginWithDiscord() {
      log('🔑 Opening Discord login...');
      const clientId = 'YOUR_CLIENT_ID'; // Replace with your app's client ID
      const redirectUri = window.location.origin + window.location.pathname;
      const scope = 'identify guilds messages.read';
      const url = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${scope}`;
      
      // Open popup
      const width = 500, height = 700;
      const left = window.screenX + (window.outerWidth - width) / 2;
      const top = window.screenY + (window.outerHeight - height) / 2;
      const popup = window.open(url, 'Discord Login', `width=${width},height=${height},left=${left},top=${top}`);
      
      // Wait for redirect
      const checkPopup = setInterval(() => {
        try {
          if (popup.closed) {
            clearInterval(checkPopup);
            return;
          }
          const popupUrl = popup.location.href;
          if (popupUrl.includes('access_token=')) {
            const hash = popupUrl.split('#')[1];
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            if (accessToken) {
              token = accessToken;
              localStorage.setItem('discord_token', token);
              popup.close();
              clearInterval(checkPopup);
              log('✅ Login successful!');
              fetchUserInfo();
              showControls();
            }
          }
        } catch (e) { /* cross-origin, ignore */ }
      }, 500);
    }

    async function fetchUserInfo() {
      try {
        const res = await fetch('https://discord.com/api/v10/users/@me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        userInfo.textContent = `👤 ${data.username}#${data.discriminator}`;
        log(`👋 Logged in as ${data.username}`);
      } catch (err) {
        log(`⚠️ Could not fetch user: ${err.message}`);
      }
    }

    function showControls() {
      authBtn.classList.add('hidden');
      startBtn.classList.remove('hidden');
      stopBtn.classList.remove('hidden');
    }

    // ===== DISCORD GATEWAY (WebSocket) =====
    async function startForwarder() {
      const channelId = document.getElementById('channelId').value.trim();
      const webhook = document.getElementById('webhook').value.trim();

      if (!channelId || !webhook) {
        log('❌ Fill Channel ID and Webhook URL');
        return;
      }

      if (!token) {
        log('❌ Please login first');
        return;
      }

      if (forwardActive) {
        log('⚠️ Already running');
        return;
      }

      log('🔗 Connecting to Discord Gateway...');
      setStatus(false);

      try {
        const gwResp = await fetch('https://discord.com/api/v10/gateway');
        const gwData = await gwResp.json();
        const gatewayUrl = gwData.url + '/?v=10&encoding=json';

        ws = new WebSocket(gatewayUrl);

        ws.onopen = () => {
          log('✅ WebSocket open — identifying');
          ws.send(JSON.stringify({
            op: 2,
            d: {
              token: token,
              intents: 512, // GuildMessages
              properties: {
                os: 'browser',
                browser: 'cat-forwarder',
                device: 'cat-paw'
              }
            }
          }));
        };

        ws.onmessage = (event) => {
          try {
            const payload = JSON.parse(event.data);
            const { op, d, t, s } = payload;

            if (s) lastSeq = s;

            if (t === 'READY') {
              sessionId = d.session_id;
              log(`✅ Ready — session: ${sessionId}`);
              setStatus(true);
              forwardActive = true;

              // Request channel messages
              ws.send(JSON.stringify({
                op: 14,
                d: {
                  guild_id: null,
                  channel_id: channelId,
                  limit: 50
                }
              }));
              log(`📥 Fetching last 50 messages from channel...`);
            }

            if (t === 'MESSAGE_CREATE') {
              const msg = d;
              if (msg.channel_id === channelId && !msg.author.bot) {
                log(`📩 Forward: ${msg.author.username}: ${msg.content || '(embed/attach)'}`);
                fetch(webhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    content: msg.content || '(no text)',
                    embeds: msg.embeds || [],
                    username: msg.author.username,
                    avatar_url: msg.author.avatar ? `https://cdn.discordapp.com/avatars/${msg.author.id}/${msg.author.avatar}.png` : null
                  })
                }).then(res => {
                  if (!res.ok) log(`⚠️ Webhook failed: ${res.status}`);
                  else log(`✅ Forwarded to webhook`);
                }).catch(err => log(`❌ Webhook error: ${err.message}`));
              }
            }

            if (op === 10) {
              const interval = d.heartbeat_interval;
              if (heartbeat) clearInterval(heartbeat);
              heartbeat = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({ op: 1, d: lastSeq || null }));
                }
              }, interval);
              log(`💓 Heartbeat set (${interval}ms)`);
            }

            // Handle errors
            if (op === 9) {
              log('❌ Invalid session — reconnecting...');
              setTimeout(() => startForwarder(), 3000);
            }

          } catch (err) {
            log(`⚠️ Parse error: ${err.message}`);
          }
        };

        ws.onerror = (err) => {
          log(`❌ WS error — check token or network`);
          setStatus(false);
          forwardActive = false;
        };

        ws.onclose = (event) => {
          log(`🔌 Disconnected (code: ${event.code})`);
          setStatus(false);
          forwardActive = false;
          if (heartbeat) clearInterval(heartbeat);
          
          // Auto-reconnect on non-normal close
          if (event.code !== 1000) {
            log('🔄 Auto-reconnecting in 5s...');
            setTimeout(() => {
              if (!forwardActive) startForwarder();
            }, 5000);
          }
        };

      } catch (err) {
        log(`❌ Init error: ${err.message}`);
        setStatus(false);
      }
    }

    function stopForwarder() {
      if (ws) {
        ws.close(1000, 'Manual stop');
        ws = null;
      }
      if (heartbeat) {
        clearInterval(heartbeat);
        heartbeat = null;
      }
      forwardActive = false;
      setStatus(false);
      log('⏹ Stopped');
    }

    // ===== UI BINDINGS =====
    authBtn.addEventListener('click', loginWithDiscord);
    startBtn.addEventListener('click', startForwarder);
    stopBtn.addEventListener('click', stopForwarder);

    // Check for existing token
    if (token) {
      log('🔑 Token found — logging in...');
      fetchUserInfo();
      showControls();
    } else {
      log('🔑 Click "Login with Discord" to start');
    }

    // Handle OAuth redirect callback
    if (window.location.hash.includes('access_token=')) {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      if (accessToken) {
        token = accessToken;
        localStorage.setItem('discord_token', token);
        window.location.hash = '';
        log('✅ Login successful!');
        fetchUserInfo();
        showControls();
      }
    }

    log('🐱 CAT loaded — ready to forward');
  </script>
</body>
</html>
