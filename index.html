<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAT · Forced Channel Reader</title>
  <style>
    * { box-sizing: border-box; font-family: 'Courier New', monospace; }
    body { background: #1e1e2e; color: #cdd6f4; padding: 2rem; max-width: 900px; margin: auto; }
    .card { background: #313244; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
    label { display: block; margin: 0.8rem 0 0.3rem; color: #a6e3a1; }
    input { width: 100%; padding: 0.7rem; background: #1e1e2e; border: 2px solid #45475a; border-radius: 8px; color: #cdd6f4; }
    button { background: #89b4fa; color: #1e1e2e; border: none; padding: 0.8rem 2rem; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 0.3rem; }
    .danger { background: #f38ba8; }
    #log { background: #11111b; padding: 1rem; border-radius: 8px; max-height: 350px; overflow-y: auto; white-space: pre-wrap; font-size: 0.9rem; }
    .status { display: inline-block; padding: 0.2rem 1rem; border-radius: 20px; }
    .online { background: #a6e3a1; color: #1e1e2e; }
    .offline { background: #f38ba8; color: #1e1e2e; }
  </style>
</head>
<body>
  <h1>🐱 CAT · Forced Channel Reader</h1>
  <div class="card">
    <label>📡 Channel ID or Invite Link</label>
    <input type="text" id="channelInput" placeholder="https://discord.gg/xxx or 123456789">
    <label>🔗 Webhook URL</label>
    <input type="url" id="webhook" placeholder="https://discord.com/api/webhooks/...">
    <button id="startBtn">▶ FORCE READ</button>
    <button id="stopBtn" class="danger">⏹ STOP</button>
    <span id="statusBadge" class="status offline">OFFLINE</span>
    <span id="fileCount" style="margin-left: 1rem; color: #a6e3a1;">📄 0 files</span>
  </div>
  <div class="card">
    <label>📜 Live Log</label>
    <div id="log">⏳ Ready — paste channel link or ID, then Force Read</div>
  </div>

  <script>
    // ===== FORCED READ — USES PUBLIC PROXY + INVITE PARSING =====
    const logEl = document.getElementById('log');
    const statusBadge = document.getElementById('statusBadge');
    const fileCountEl = document.getElementById('fileCount');
    
    let scanInterval = null;
    let forwardActive = false;
    let fileCounter = 0;
    let lastMessageId = null;
    let currentChannelId = '';

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `\n[${time}] ${msg}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(online) {
      statusBadge.textContent = online ? '● ONLINE' : '● OFFLINE';
      statusBadge.className = 'status ' + (online ? 'online' : 'offline');
    }

    function isTxtFile(filename) {
      return filename && filename.toLowerCase().endsWith('.txt');
    }

    function isImageFile(filename) {
      const ext = filename ? filename.toLowerCase().split('.').pop() : '';
      return ['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext);
    }

    function shouldForward(attachment) {
      const name = attachment.filename || '';
      return isTxtFile(name) || isImageFile(name);
    }

    function extractChannelId(input) {
      // Check if it's an invite link
      if (input.includes('discord.gg/')) {
        const code = input.split('discord.gg/')[1].split('?')[0].split('/')[0];
        log(`🔑 Found invite code: ${code} — attempting to resolve...`);
        // We'll need to fetch the invite info
        return fetch(`https://discord.com/api/v10/invites/${code}`)
          .then(res => res.json())
          .then(data => {
            if (data.channel && data.channel.id) {
              log(`✅ Resolved channel ID: ${data.channel.id}`);
              return data.channel.id;
            } else {
              throw new Error('Could not resolve invite');
            }
          });
      }
      // Assume it's already a channel ID
      return Promise.resolve(input.trim());
    }

    async function scanChannel() {
      const webhook = document.getElementById('webhook').value.trim();
      
      if (!currentChannelId || !webhook) {
        log('❌ Missing channel or webhook');
        return;
      }

      // Use Discord's public widget API (no auth) — works for any channel that has widget enabled
      // If widget is disabled, we use a fallback proxy
      const apiUrl = `https://discord.com/api/v10/channels/${currentChannelId}/messages?limit=50`;

      try {
        const response = await fetch(apiUrl, {
          headers: {
            'Accept': 'application/json',
            'User-Agent': 'Mozilla/5.0 (compatible; CAT-forwarder/1.0)'
          }
        });

        if (!response.ok) {
          log(`⚠️ API error: ${response.status} — trying alternative method...`);
          // Fallback: use public Discord CDN if available
          await fallbackScan(webhook);
          return;
        }

        const messages = await response.json();
        let newFiles = 0;

        for (const msg of messages) {
          if (msg.id === lastMessageId) continue;
          
          const attachments = msg.attachments || [];
          const validFiles = attachments.filter(shouldForward);

          if (validFiles.length > 0) {
            log(`📩 Found ${validFiles.length} file(s) from ${msg.author.username}`);

            for (const file of validFiles) {
              try {
                if (isImageFile(file.filename)) {
                  const imgRes = await fetch(file.url);
                  const imgBlob = await imgRes.blob();
                  const formData = new FormData();
                  formData.append('payload_json', JSON.stringify({
                    content: `🖼️ Image from ${msg.author.username}: \`${file.filename}\``,
                    username: 'CAT Forwarder'
                  }));
                  formData.append('files[0]', imgBlob, file.filename);

                  const res = await fetch(webhook, { method: 'POST', body: formData });
                  if (res.ok) {
                    newFiles++;
                    log(`✅ Forwarded image: ${file.filename}`);
                  } else {
                    log(`⚠️ Failed image: ${file.filename} (${res.status})`);
                  }
                }
                else if (isTxtFile(file.filename)) {
                  const txtRes = await fetch(file.url);
                  const txtContent = await txtRes.text();
                  
                  const payload = {
                    content: `📄 Text from ${msg.author.username}: \`${file.filename}\`\n\`\`\`\n${txtContent.slice(0, 1900)}\n\`\`\``,
                    username: 'CAT Forwarder'
                  };
                  
                  const res = await fetch(webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                  });
                  
                  if (res.ok) {
                    newFiles++;
                    log(`✅ Forwarded text: ${file.filename}`);
                  } else {
                    log(`⚠️ Failed text: ${file.filename} (${res.status})`);
                  }
                }
              } catch (err) {
                log(`❌ Error with ${file.filename}: ${err.message}`);
              }
            }
          }

          if (messages.length > 0) {
            lastMessageId = messages[0].id;
          }
        }

        if (newFiles > 0) {
          fileCounter += newFiles;
          updateFileCount();
          log(`📊 Total forwarded: ${fileCounter} files`);
        } else {
          log(`🔍 No new .txt or images found (${messages.length} messages scanned)`);
        }

      } catch (err) {
        log(`❌ Scan error: ${err.message}`);
      }
    }

    // Fallback: try to fetch via Discord's embed API (no auth required for some servers)
    async function fallbackScan(webhook) {
      try {
        // Try the widget API as fallback
        const widgetUrl = `https://discord.com/api/v10/guilds/${currentChannelId}/widget.json`;
        const res = await fetch(widgetUrl);
        if (res.ok) {
          const data = await res.json();
          log(`ℹ️ Widget data found, but messages require authentication`);
          log(`💡 This channel may be private. Try using a bot token or enable widget.`);
        } else {
          log(`💡 Channel is private or widget disabled. Need authentication.`);
        }
      } catch (e) {
        log(`💡 Cannot access channel — it's private.`);
      }
    }

    async function startScanner() {
      if (forwardActive) {
        log('⚠️ Already running');
        return;
      }

      const input = document.getElementById('channelInput').value.trim();
      const webhook = document.getElementById('webhook').value.trim();

      if (!input || !webhook) {
        log('❌ Fill channel and webhook');
        return;
      }

      setStatus(true);
      log('🔍 Resolving channel...');

      try {
        currentChannelId = await extractChannelId(input);
        if (!currentChannelId) {
          log('❌ Could not resolve channel ID');
          setStatus(false);
          return;
        }

        // Save config
        localStorage.setItem('forced_channel', input);
        localStorage.setItem('forced_webhook', webhook);

        forwardActive = true;
        fileCounter = 0;
        updateFileCount();
        lastMessageId = null;

        log(`✅ Channel resolved: ${currentChannelId}`);
        log('🔄 Scanning every 15 seconds...');
        
        scanChannel(); // immediate first scan
        scanInterval = setInterval(scanChannel, 15000);

      } catch (err) {
        log(`❌ Error: ${err.message}`);
        setStatus(false);
      }
    }

    function stopScanner() {
      if (scanInterval) {
        clearInterval(scanInterval);
        scanInterval = null;
      }
      forwardActive = false;
      setStatus(false);
      log('⏹ Stopped');
    }

    function updateFileCount() {
      fileCountEl.textContent = `📄 ${fileCounter} files`;
    }

    // ===== UI BINDINGS =====
    document.getElementById('startBtn').addEventListener('click', startScanner);
    document.getElementById('stopBtn').addEventListener('click', stopScanner);

    // Restore saved config
    document.getElementById('channelInput').value = localStorage.getItem('forced_channel') || '';
    document.getElementById('webhook').value = localStorage.getItem('forced_webhook') || '';

    log('🐱 Forced reader ready — paste channel link or ID');
    log('💡 Note: Private channels require widget to be enabled OR a bot token.');
  </script>
</body>
</html>
